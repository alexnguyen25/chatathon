# XcodeGen spec. The repository has no .xcodeproj checked in — it is generated
# from this file, which keeps the project structure reviewable as text and
# avoids merge conflicts in a pbxproj nobody can read.
#
#   brew install xcodegen && cd ios && xcodegen generate
name: PulsePlan

options:
  bundleIdPrefix: com.pulseplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  StressCore:
    path: StressCore
  StressMonitorUI:
    path: StressMonitorUI

targets:
  PulsePlan:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: StressCore
        product: StressCore
      - package: StressMonitorUI
        product: StressMonitorUI
